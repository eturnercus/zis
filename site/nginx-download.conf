# Copy to /etc/nginx/sites-available/ OR just run from repo root:
#   sudo ./start-zis.sh
# That starts the python API and injects /admin/api/ into the live site.

server {
    listen 80;
    server_name zis.inflexus.world www.zis.inflexus.world;

    root /var/www/zis.inflexus.world;
    index index.html;
    charset utf-8;
    client_max_body_size 48m;

    access_log /var/log/nginx/zis.inflexus.world.access.log;
    error_log /var/log/nginx/zis.inflexus.world.error.log;

    location = /download {
        return 301 /download/;
    }

    location /download/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
        default_type application/octet-stream;
    }

    # Client pack: rsync/symlink C:\zis\cloud → /var/www/zis.inflexus.world/download/cloud
    # Do not copy the pack into the HTML site tree besides this path.
    location /download/cloud/ {
        alias /var/www/zis.inflexus.world/download/cloud/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /admin-api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin-api.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~* \.php$ {
        deny all;
        return 404;
    }

    location = /content.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }
        gzip off;
        types {
            video/mp4 mp4;
            video/webm webm;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
        }
        default_type application/octet-stream;
    }
    # Run: python3 /opt/zis/private/admin_api.py  (ZIS_SITE_ROOT + ZIS_PRIVATE)
    location /admin/api/ {
        client_max_body_size 48m;
        proxy_pass http://127.0.0.1:8744;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header X-Powered-By;
        proxy_pass_header Set-Cookie;
    }

    location ~* \.(ps1|py|service)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /;
    }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) {
        return 301 /$1;
    }
}
